name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-latest
            target: linux-aarch64
            cross: aarch64-linux-gnu
          - os: macos-13
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.cross }}

      - name: Set CC
        id: cc
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            echo "cc=${{ matrix.cross }}-cc" >> "$GITHUB_OUTPUT"
          else
            echo "cc=cc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: make clean && make CC="${{ steps.cc.outputs.cc }}"

      - name: Package
        run: |
          tar czf flashcheck-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C build flashcheck
          shasum -a 256 flashcheck-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > flashcheck-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            flashcheck-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            flashcheck-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
