name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build-type: [release, debug, asan]

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-tidy

      - name: Build (release)
        if: matrix.build-type == 'release'
        run: |
          make clean
          make
          make build/flashcheck-tests

      - name: Build and test (release)
        if: matrix.build-type == 'release'
        run: |
          ./build/flashcheck-tests
          echo "== CLI smoke =="
          ./build/flashcheck --version
          ./build/flashcheck --help >/dev/null
          ./build/flashcheck --self-test=alias --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 1
          ./build/flashcheck --self-test=honest --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 0
          ./build/flashcheck --self-test=stale --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 1
          ./build/flashcheck --self-test=error --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 4
          echo "== all CLI smoke tests passed =="

      - name: Build (debug)
        if: matrix.build-type == 'debug'
        run: |
          make clean
          make debug

      - name: Test (debug)
        if: matrix.build-type == 'debug'
        run: |
          ./build/flashcheck-tests
          ./build/flashcheck --self-test=honest --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 0

      - name: Build (asan)
        if: matrix.build-type == 'asan'
        run: |
          make clean
          make asan

      - name: Test (asan)
        if: matrix.build-type == 'asan'
        run: |
          ./build/flashcheck-tests
          ./build/flashcheck --self-test=honest --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 0

      - name: Lint
        run: |
          make lint || true

      - name: Self-test smoke
        run: |
          ./build/flashcheck --self-test=honest --self-reported=256MiB --self-real=128MiB --yes
          ./build/flashcheck --self-test=alias --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 1
          ./build/flashcheck --self-test=stale --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 1
          ./build/flashcheck --self-test=error --self-reported=256MiB --self-real=128MiB --yes; test $? -eq 4
